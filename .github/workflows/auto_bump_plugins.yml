name: Auto Bump Plugins and Launcher Manifest

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'plugins.json'
      - 'version.json'
      - '.github/**'
      - 'README.md'
      - '.gitignore'
  release:
    types: [published, created, edited, released]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Auto-bump plugin versions when plugin files are pushed
  # -------------------------------------------------------------
  bump-plugins:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect Changed Plugins and Increment Version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import json, subprocess, os, urllib.parse

          before_sha = os.environ.get('BEFORE_SHA', '')
          after_sha = os.environ.get('AFTER_SHA', 'HEAD')

          diff_output = []
          if before_sha and before_sha != '0000000000000000000000000000000000000000':
              try:
                  subprocess.check_call(['git', 'cat-file', '-e', f'{before_sha}^{{commit}}'])
                  diff_output = subprocess.check_output(
                      ['git', 'diff', '--name-only', before_sha, after_sha],
                      text=True
                  ).splitlines()
              except Exception as e:
                  print(f'Direct before_sha diff failed ({e}), falling back...')

          if not diff_output:
              try:
                  diff_output = subprocess.check_output(
                      ['git', 'diff', '--name-only', 'HEAD~1', 'HEAD'],
                      text=True
                  ).splitlines()
              except Exception:
                  try:
                      diff_output = subprocess.check_output(
                          ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', after_sha],
                          text=True
                      ).splitlines()
                  except Exception:
                      diff_output = []

          print(f'Changed files in commit(s): {diff_output}')

          if not os.path.exists('plugins.json'):
              print('plugins.json not found.')
              exit(0)

          with open('plugins.json', 'r', encoding='utf-8') as f:
              plugins = json.load(f)

          plugins_to_bump = set()
          ignored_roots = {'.github', '.git', 'cache', 'icons', 'lib'}

          for p in plugins:
              if not isinstance(p, dict) or 'name' not in p:
                  continue

              p_name = p['name'].strip()
              folder_names = {p_name.lower()}
              if 'install_path' in p:
                  folder_names.add(p['install_path'].replace('\\', '/').split('/')[-1].lower())

              icon_url = p.get('icon_url', '')
              icon_path = urllib.parse.urlparse(icon_url).path.lower()
              icon_filename = os.path.basename(icon_path)

              for file in diff_output:
                  file_clean = file.strip().replace('\\', '/').strip('/')
                  parts = file_clean.split('/')

                  if len(parts) > 1 and parts[0].lower() in folder_names and parts[0].lower() not in ignored_roots:
                      filename = parts[-1].lower()
                      # Determine if the modified file is an icon (which should NOT trigger version bump)
                      is_icon = (
                          (filename == icon_filename) or
                          (file_clean.lower() in icon_path and icon_path != '') or
                          (icon_filename and filename in [
                              os.path.splitext(icon_filename)[0] + ext
                              for ext in ['.png', '.ico', '.jpg', '.jpeg', '.svg']
                          ])
                      )

                      if not is_icon:
                          print(f"Plugin '{p_name}': triggering bump due to change in file '{file_clean}'")
                          plugins_to_bump.add(p_name)
                      else:
                          print(f"Plugin '{p_name}': ignoring icon file change '{file_clean}'")

          if not plugins_to_bump:
              print('No plugin non-icon file changes detected.')
              exit(0)

          print(f'Plugins to bump: {plugins_to_bump}')
          updated_any = False

          for p in plugins:
              p_name = p.get('name', '').strip()
              if p_name in plugins_to_bump:
                  old_v = str(p.get('version', '1.0.0')).strip()
                  parts = old_v.split('.')
                  while len(parts) < 3:
                      parts.append('0')
                  try:
                      parts[-1] = str(int(parts[-1]) + 1)
                      new_v = '.'.join(parts)
                      p['version'] = new_v
                      print(f"Auto-bumped '{p_name}': {old_v} -> {new_v}")
                      updated_any = True
                  except ValueError:
                      pass

          if updated_any:
              with open('plugins.json', 'w', encoding='utf-8') as f:
                  json.dump(plugins, f, indent=2, ensure_ascii=False)
                  f.write('\n')
          EOF

      - name: Commit & Push Updated plugins.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(plugins): auto-bump plugin versions [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  # -----------------------------------------------------------------
  # Job 2: Auto-update version.json from GitHub Release
  # -----------------------------------------------------------------
  sync-launcher-release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_ASSETS: ${{ toJSON(github.event.release.assets) }}
      REPO_NAME: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update version.json with Latest Release Tag & Download URL
        run: |
          python -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import json, os, urllib.request

          repo = os.environ.get('REPO_NAME', 'iMAboud/iMA-Menu-Plugins')
          tag_raw = os.environ.get('RELEASE_TAG', '').strip()
          assets_raw = os.environ.get('RELEASE_ASSETS', '[]')
          token = os.environ.get('GITHUB_TOKEN', '')

          # If triggered manually via workflow_dispatch or tag missing, fetch latest release via API
          if not tag_raw:
              headers = {'User-Agent': 'GitHub-Action'}
              if token:
                  headers['Authorization'] = f'Bearer {token}'
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/releases/latest',
                  headers=headers
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      rel_data = json.loads(resp.read().decode('utf-8'))
                      tag_raw = str(rel_data.get('tag_name', '')).strip()
                      assets_raw = json.dumps(rel_data.get('assets', []))
              except Exception as e:
                  print(f'Error querying GitHub API for latest release: {e}')

          tag_clean = tag_raw.lstrip('vV').strip()
          try:
              assets = json.loads(assets_raw)
          except Exception:
              assets = []

          download_url = None
          for asset in assets:
              if asset.get('name', '').lower() == 'launcher.exe':
                  download_url = asset.get('browser_download_url')
                  break

          # Fallback if asset list is empty or processing
          if not download_url and tag_raw:
              download_url = f'https://github.com/{repo}/releases/download/{tag_raw}/launcher.exe'

          if not download_url:
              print('Could not determine download_url.')
              exit(0)

          manifest = {
              'version': tag_clean,
              'download_url': download_url
          }

          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write('\n')

          print(f'Updated version.json -> version: {tag_clean}, download_url: {download_url}')
          EOF

      - name: Commit & Push Updated version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(launcher): sync version.json [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

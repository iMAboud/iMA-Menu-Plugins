name: Auto Bump Plugins and Launcher Manifest

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'plugins.json'
      - 'version.json'
      - '.github/**'
      - 'README.md'
      - '.gitignore'
  release:
    types: [published, created, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Auto-bump plugin versions when plugin files are pushed
  # -------------------------------------------------------------
  bump-plugins:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect Changed Plugins and Increment Version
        run: |
          python - << 'EOF'
          import json, subprocess, os

          before_sha = "${{ github.event.before }}"
          after_sha = "${{ github.sha }}"

          if before_sha == "0000000000000000000000000000000000000000" or not before_sha:
              diff_cmd = ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', after_sha]
          else:
              diff_cmd = ['git', 'diff', '--name-only', before_sha, after_sha]

          diff_output = subprocess.check_output(diff_cmd, text=True).splitlines()

          ignored_roots = {'.github', '.git', 'cache', 'icons', 'lib'}
          changed_folders = set()
          for file in diff_output:
              parts = file.strip().replace('\\', '/').split('/')
              if len(parts) > 1 and parts[0].lower() not in ignored_roots:
                  changed_folders.add(parts[0].lower())

          if not changed_folders:
              print("No plugin folder changes detected.")
              exit(0)

          print(f"Detected changed folders: {changed_folders}")

          if not os.path.exists('plugins.json'):
              print("plugins.json not found.")
              exit(0)

          with open('plugins.json', 'r', encoding='utf-8') as f:
              plugins = json.load(f)

          updated_any = False
          for p in plugins:
              if not isinstance(p, dict) or 'name' not in p:
                  continue
              p_name = p['name'].strip()
              folder_name = p.get('install_path', '').replace('\\', '/').split('/')[-1].lower()
              if p_name.lower() in changed_folders or folder_name in changed_folders:
                  old_v = str(p.get('version', '1.0.0')).strip()
                  parts = old_v.split('.')
                  while len(parts) < 3:
                      parts.append('0')
                  try:
                      parts[-1] = str(int(parts[-1]) + 1)
                      new_v = '.'.join(parts)
                      p['version'] = new_v
                      print(f"Auto-bumped '{p_name}': {old_v} -> {new_v}")
                      updated_any = True
                  except ValueError:
                      pass

          if updated_any:
              with open('plugins.json', 'w', encoding='utf-8') as f:
                  json.dump(plugins, f, indent=2, ensure_ascii=False)
              with open(os.environ['GITHUB_ENV'], 'a') as env_file:
                  env_file.write("HAS_BUMP=true\n")
          EOF

      - name: Commit & Push Updated plugins.json
        if: env.HAS_BUMP == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git commit -m "chore(plugins): auto-bump plugin versions [skip ci]"
          git push

  # -----------------------------------------------------------------
  # Job 2: Auto-update version.json from GitHub Release
  # -----------------------------------------------------------------
  sync-launcher-release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_ASSETS: ${{ toJSON(github.event.release.assets) }}
      REPO_NAME: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update version.json with Latest Release Tag & Download URL
        run: |
          python - << 'EOF'
          import json, os, urllib.request

          repo = os.environ.get('REPO_NAME', 'iMAboud/iMA-Menu-Plugins')
          tag_raw = os.environ.get('RELEASE_TAG', '').strip()
          assets_raw = os.environ.get('RELEASE_ASSETS', '[]')
          token = os.environ.get('GITHUB_TOKEN', '')

          # If triggered manually via workflow_dispatch, fetch latest release via API
          if not tag_raw:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/latest",
                  headers={"User-Agent": "GitHub-Action", "Authorization": f"Bearer {token}"}
              )
              with urllib.request.urlopen(req) as resp:
                  rel_data = json.loads(resp.read().decode('utf-8'))
                  tag_raw = str(rel_data.get('tag_name', '')).strip()
                  assets_raw = json.dumps(rel_data.get('assets', []))

          tag_clean = tag_raw.lstrip('vV').strip()
          try:
              assets = json.loads(assets_raw)
          except Exception:
              assets = []

          download_url = None
          for asset in assets:
              if asset.get('name', '').lower() == 'launcher.exe':
                  download_url = asset.get('browser_download_url')
                  break

          # Fallback if asset list is empty or processing
          if not download_url:
              download_url = f"https://github.com/{repo}/releases/download/{tag_raw}/launcher.exe"

          manifest = {
              "version": tag_clean,
              "download_url": download_url
          }

          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)

          print(f"Updated version.json -> version: {tag_clean}, download_url: {download_url}")
          EOF

      - name: Commit & Push Updated version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(launcher): sync version.json [skip ci]"
          git push
